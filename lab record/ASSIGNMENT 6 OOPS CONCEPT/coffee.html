<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DATA HIDING AND ABSTRACTION</title>
    <style>
        body {
            font-family: arial;
            background-color: #f2f2f2;
            text-align: center;
            margin-top: 50px;
        }
        .container {
            background: white;
            width: 400px;
            margin: auto;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }
        button {
            padding: 10px 20px;
            margin: 15px 5px;
            cursor: pointer;
        }
        #result {
            margin-top: 20px;
            font-weight: bold;
            color: #6F4E37; /* Coffee brown color for thematic styling */
            text-align: left;
            line-height: 1.6;
            padding-left: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Coffee Machine</h2>
        <button onclick="makeCoffee()">Start Coffee Machine</button>
        <div id="result"></div>
    </div>

    <script>
        // JavaScript Class
        class CoffeeMachine {
            // DATA HIDING & ABSTRACTION
            // Private methods cannot be accessed directly outside the class
            #boilWater() {
                return 'Water is boiling...';
            }

            #brewCoffee() {
                return 'Brewing coffee beans...';
            }

            // The user only interacts with this simple public method
            start() {
                let steps = [];
                steps.push(this.#boilWater());
                steps.push(this.#brewCoffee());
                steps.push('Coffee is ready! ☕');
                return steps;
            }
        }

        // Create object
        const machine = new CoffeeMachine();

        function makeCoffee() {
            // Hides internal boiling/brewing mechanics from the user.
            let processSteps = machine.start();
            
            // Format the array into readable lines for the UI
            document.getElementById("result").innerHTML = processSteps.join("<br>");
        }
    </script>

</body>
</html>
