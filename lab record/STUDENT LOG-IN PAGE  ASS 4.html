
<html>
<head>
<title>Student Login</title>
<style>
 * {
box-sizing: border-box;
}
body {
margin: 0;
height: 100vh;
display: flex;
justify-content: center;
align-items: center;
font-family: Arial, sans-serif;
background-image: url("https://thumbs.dreamstime.com/b/old-book-flying-letters-magic-light-background-bookshelf-library-ancient-books-as-symbol-knowledge-history-218640948.jpg");
background-size: cover;
background-position: center;
 }
 .container {
 width: 800px;
 height: 510px;
 display: flex;
 border-radius: 70px;
 box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }
.welcome {
width: 42%;
background: linear-gradient(135deg, #e5231c, #f06424);
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
color: white;
}
 .welcome h1 {
 font-size: 28px;
 margin-bottom: 30px;
}
 .signup {
 width: 130px;
 height: 40px;
 border: none;
 border-radius: 25px;
 background-color: #eeeeee;
 color: #777;
cursor: pointer;
        }
.login {
width: 58%;
background-color: #f5f5f5;
padding: 80px 70px;
   }
.login h2 {
color: #9b5d51;
font-size: 27px;
font-weight: normal;
margin-bottom: 40px;
        }
.login label {
 display: block;
 font-size: 12px;
 color: #333;
  margin-bottom: 7px;
        }
.login input[type="email"],
.login input[type="password"] {
 width: 100%;
 height: 38px;
 padding: 10px;
 border: 1px solid #ccc;
border-radius: 2px;
        }
 .message {
 display: block;		
 font-size: 9px;
 color: #888;
 margin-top: 5px;
 margin-bottom: 18px;
        }
 .checkbox {
 display: flex;
 align-items: center;
 margin-top: 15px;
        }
 .checkbox input {
  width: 15px;
  height: 15px;
  margin-right: 3px;
  }
 .checkbox label {
  margin: 0;
  font-size: 11px;
  }
 .signin {
 display: block;
 margin: 35px auto 0;
 width: 60px;
 height: 28px;
 border: none;
 border-radius: 2px;
 background-color: #1687d9;
 color: white;
 font-size: 9px;
 cursor: pointer;
}
</style>
</head>
<body>
<div class="container">
<div class="welcome">
<h1>Welcome Student</h1>
<button class="signup">
 SIGN UP
</button>
</div>
<div class="login">
<h2>STUDENT LOGIN</h2>
<form>
<label>Email address</label>
<input type="email" placeholder="Enter your email">
<small class="message">
We'll never share your email with anyone else.
</small>
<label>Password</label>
<input type="password"placeholder="Password">
<div class="checkbox">
<input type="checkbox">
<label>
 Check me out
</label>
</div>
<button class="signin">
 SIGN IN
</button>
</form>
</div>
</div>
</body>
